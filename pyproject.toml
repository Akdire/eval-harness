[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness-lite"
version = "0.1.0"
description = "A small, focused eval harness for evaluating AI systems in Python. Zero dependencies."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Akil Sherif", email = "akilsherif@yahoo.com" }]
requires-python = ">=3.9"
keywords = ["evaluation", "eval", "testing", "ai", "llm", "harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Akdire/eval-harness"
Repository = "https://github.com/Akdire/eval-harness"
Issues = "https://github.com/Akdire/eval-harness/issues"

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]